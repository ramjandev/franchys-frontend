name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            mkdir -p /root/franchys-frontend
            cd /root/franchys-frontend
            git init
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ramjandev/franchys-frontend.git || git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ramjandev/franchys-frontend.git
            git fetch origin main
            git reset --hard origin/main
            docker compose down || true
            docker compose up -d --build
            docker image prune -f
            docker ps --filter "name=francys_frontend"

