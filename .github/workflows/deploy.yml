name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="/root/franchys-frontend"

            echo ">>> Navigating to deployment directory..."
            if [ ! -d "$APP_DIR" ]; then
              echo ">>> Cloning repository..."
              git clone https://github.com/ramjandev/franchys-frontend.git "$APP_DIR"
              cd "$APP_DIR"
            else
              echo ">>> Pulling latest changes from main branch..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            echo ">>> Building and starting Docker container..."
            docker compose down || true
            docker compose up -d --build

            echo ">>> Cleaning up dangling images..."
            docker image prune -f

            echo ">>> Deployment completed successfully! Container status:"
            docker ps --filter "name=francys_frontend"
